
name: SANARAH Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract SANARAH Source
        run: |
          mkdir -p source
          unzip -oq SANARAH-source-fixed-part1.zip -d source
          unzip -oq SANARAH-source-fixed-part2.zip -d source

      - name: Verify Source Files
        run: |
          test -f source/SanarahProject/settings.gradle
          test -f source/SanarahProject/build.gradle
          test -f source/SanarahProject/app/build.gradle
          test -f source/SanarahProject/gradlew
          test -f source/SanarahProject/gradle/wrapper/gradle-wrapper.jar
          test -f source/SanarahProject/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build SANARAH APK
        working-directory: source/SanarahProject
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-APK
          path: source/SanarahProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
