
name: Build SANARAH Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source archives
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archives = [
              Path("SANARAH_BUILD_READY_PART1.zip"),
              Path("SANARAH_BUILD_READY_PART2.zip"),
          ]

          out = Path("source")
          out.mkdir(exist_ok=True)

          for archive in archives:
              if not archive.is_file():
                  raise SystemExit(f"ERROR: missing archive: {archive}")

              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(
                          f"ERROR: damaged ZIP entry in {archive}: {bad}"
                      )

                  for info in z.infolist():
                      if info.is_dir():
                          continue

                      target = (out / info.filename).resolve()

                      if not target.is_relative_to(out.resolve()):
                          raise SystemExit(
                              f"ERROR: unsafe archive path: {info.filename}"
                          )

                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(info.filename))

              print(f"Extracted: {archive}")

          print("===== PROJECT FILES =====")

          for p in sorted(out.rglob("*")):
              if p.is_file() and p.name in {
                  "settings.gradle",
                  "settings.gradle.kts",
                  "build.gradle",
                  "build.gradle.kts",
                  "gradlew"
              }:
                  print(p)
          PY

      - name: Detect Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -f "$CANDIDATE/gradlew" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Found Gradle wrappers:"
            find source -type f -name gradlew -print || true

            echo "Found settings files:"
            find source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print || true

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager --licenses </dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Build SANARAH APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleDebug \
            --stacktrace \
            --info 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-BUILD-LOG
          path: source/**/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
