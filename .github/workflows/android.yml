
name: SANARAH Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source
        run: |
          mkdir -p source
          unzip -oq SANARAH-source-fixed-part1.zip -d source
          unzip -oq SANARAH-source-fixed-part2.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          PROJECT=source/SanarahProject
          chmod +x "$PROJECT/app/gradlew"
          cd "$PROJECT/app"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-APK
          path: source/SanarahProject/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
