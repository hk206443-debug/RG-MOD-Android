name: Build SANARAH Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e
          mkdir -p source
          echo "Checking source ZIP files..."
          test -f SANARAH-merged-part-1.zip
          test -f SANARAH-merged-part-2.zip
          unzip -oq SANARAH-merged-part-1.zip -d source
          unzip -oq SANARAH-merged-part-2.zip -d source
          test -f source/SanarahProject/gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android packages
        run: |
          set -e
          sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Build SANARAH APK
        working-directory: source/SanarahProject
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-APK
          path: source/SanarahProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
