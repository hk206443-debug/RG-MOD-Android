
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p source
          unzip -oq RG-MOD-source-part1.zip -d source
          unzip -oq RG-MOD-source-part2.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;24.0.8215888"

      - name: Build APK
        run: |
          ROOT=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            find source -maxdepth 5 -type f
            exit 1
          fi
          cd "$(dirname "$ROOT")"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RG-MOD-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
