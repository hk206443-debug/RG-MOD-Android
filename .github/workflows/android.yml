
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find and Extract Source
        run: |
          mkdir -p source

          echo "Searching for source ZIP files..."

          PART1=$(find . -type f -iname '*part1*.zip' -not -path './.git/*' -print -quit)
          PART2=$(find . -type f -iname '*part2*.zip' -not -path './.git/*' -print -quit)

          echo "Part 1: ${PART1:-NOT FOUND}"
          echo "Part 2: ${PART2:-NOT FOUND}"

          if [ -z "$PART1" ]; then
            echo "ERROR: Part 1 ZIP file not found in repository"
            exit 1
          fi

          if [ -z "$PART2" ]; then
            echo "ERROR: Part 2 ZIP file not found in repository"
            exit 1
          fi

          unzip -oq "$PART1" -d source
          unzip -oq "$PART2" -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;24.0.8215888"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Locate Gradle project
        id: project
        run: |
          ROOT=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "dir=$(dirname "$ROOT")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RG-MOD-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
