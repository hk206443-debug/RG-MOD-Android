
name: Build SANARAH Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract source
        run: |
          set -e
          mkdir -p source

          test -f SANARAH-source-part-1.zip
          test -f SANARAH-source-part-2.zip

          unzip -o SANARAH-source-part-1.zip -d source
          unzip -o SANARAH-source-part-2.zip -d source

          test -f source/SanarahProject/gradlew
          echo "Source extraction successful"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;25.2.9519653

      - name: Build APK
        working-directory: source/SanarahProject
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-APK
          path: source/SanarahProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
