
name: Build SANARAH Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p source

          unzip -oq SANARAH-repaired-part-1.zip -d source
          unzip -oq SANARAH-repaired-part-2.zip -d source

          echo "===== SOURCE FILES ====="
          find source -maxdepth 5 -type f | sort | head -300

          echo "===== PROJECT FILES ====="
          find source -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name gradlew \
          \) -print

      - name: Detect Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          GRADLEW=$(find source -type f -name gradlew -print -quit || true)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          SETTINGS=$(find "$PROJECT_DIR" -maxdepth 1 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found beside gradlew"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager --licenses </dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Build SANARAH APK
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug --stacktrace --info 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          exit "$BUILD_STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-BUILD-LOG
          path: source/**/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
