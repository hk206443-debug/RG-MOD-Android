name: SANARAH Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Extract source archives
        run: |
          mkdir -p source
          unzip -oq SANARAH-source-fixed-part1.zip -d source
          unzip -oq SANARAH-source-fixed-part2.zip -d source

      - name: Build debug APK
        working-directory: source/SanarahProject
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANARAH-debug-APK
          path: source/SanarahProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
